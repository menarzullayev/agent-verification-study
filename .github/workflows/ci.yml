name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    uses: menarzullayev/.github/.github/workflows/ci-python.yml@fix/ci-python-install
    with:
      python-version: "3.12"
      run-lint: false
      # Offline tests: no network, no model calls.
      test-command: python -m unittest discover -s tests
      # A quote in a value must not break the job (it did before the shared workflow's fix).
      env-json: '{"PILOT_NOTE":"it''s fine"}'
